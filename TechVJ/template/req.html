<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="https://i.ibb.co/mrYwDLbX/mpt-logo.jpg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPT Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, #ff00ff, #00ffff, #ff0099, #00ffcc);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      z-index: -2;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(5px);
      z-index: -1;
    }
    header {
      background: rgba(20, 20, 40, 0.8);
      padding: 15px 30px;
      border-bottom: 2px solid #0ff;
      box-shadow: 0 2px 15px rgba(0,255,255,0.3);
    }
    .neon-text {
      font-family: 'Orbitron', sans-serif;
      color: #0ff;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
    }
    .glass-card {
      background: rgba(20, 20, 40, 0.7);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      padding: 2rem;
    }
    .neon-btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      font-weight: bold;
      transition: all 0.3s;
      border-radius: 30px;
      padding: 10px 25px;
      margin: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .neon-btn:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
    }
    .plyr--video {
      border-radius: 12px;
      overflow: hidden;
      max-width: 100%;
    }
    footer {
      background: rgba(0,0,0,0.8);
      text-align: center;
      padding: 15px;
      border-top: 2px solid #0ff;
      box-shadow: 0 -2px 15px rgba(0,255,255,0.4);
      font-size: 14px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header class="flex items-center justify-start gap-3">
    <a href="https://t.me/MoviesPlusTelugu" target="_blank" class="flex items-center gap-3">
      <img src="https://i.ibb.co/Df8bVHtT/mptjoin.png" alt="Logo" class="h-10 w-15">
      <h1 class="neon-text text-2xl cursor-pointer">MPT Player</h1>
    </a>
  </header>

  <main class="container mx-auto mt-5 px-4 flex-1">
    <div class="glass-card max-w-6xl mx-auto">

      <div class="video-title-container">
        <div id="videoTitle" class="video-title">{{file_name}}</div>
      </div>

      <video id="player" playsinline controls>
        <source src="{{file_url}}" type="video/mp4" />
      </video>

      <div class="text-center mt-6">
        <a onclick="lazyDownload()" class="neon-btn">
          <img src="https://img.icons8.com/color/48/download--v1.png" class="icon"> Download Now
        </a>
      </div>
    </div>
  </main>

  <footer>
    © 2025 MPT Player | All Rights Reserved
  </footer>

  <script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: [
        'play-large', 'rewind', 'play', 'fast-forward',
        'progress', 'current-time', 'duration', 'mute',
        'volume', 'settings', 'pip', 'airplay', 'fullscreen'
      ]
    });

    // ---------- Keyboard Shortcuts ----------
    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      switch (e.key.toLowerCase()) {
        case 'f': // Toggle fullscreen
          player.fullscreen.toggle();
          break;
        case 'arrowright': // Forward 10s
          player.forward(10);
          break;
        case 'arrowleft': // Backward 10s
          player.rewind(10);
          break;
        case ' ': // Space = Play/Pause
          e.preventDefault();
          player.togglePlay();
          break;
      }
    });

    // ---------- Auto Rotate on Mobile ----------
    player.on('enterfullscreen', async () => {
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock('landscape');
        } catch (err) {
          console.warn('Orientation lock not supported:', err);
        }
      }
    });

    player.on('exitfullscreen', async () => {
      if (screen.orientation && screen.orientation.unlock) {
        try {
          await screen.orientation.unlock();
        } catch (err) {
          console.warn('Orientation unlock not supported:', err);
        }
      }
    });

    // ---------- Download Function ----------
    function lazyDownload() {
      const video = document.querySelector('#player source');
      const a = document.createElement('a');
      a.href = video.src;
      a.download = video.src.split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
