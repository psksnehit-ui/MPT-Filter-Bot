<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPT Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, #ff00ff, #00ffff, #ff0099, #00ffcc);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      z-index: -2;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(5px);
      z-index: -1;
    }

    header {
      background: rgba(20, 20, 40, 0.8);
      padding: 15px;
      text-align: left;
      border-bottom: 2px solid #0ff;
      box-shadow: 0 2px 15px rgba(0,255,255,0.3);
    }

    .neon-text {
      font-family: 'Orbitron', sans-serif;
      color: #0ff;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
    }

    .glass-card {
      background: rgba(20, 20, 40, 0.7);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      padding: 2rem;
    }

    .neon-btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      font-weight: bold;
      transition: all 0.3s;
      border-radius: 30px;
      padding: 10px 25px;
      margin: 8px;
      display: inline-block;
      text-decoration: none;
    }

    .neon-btn:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
    }

    /* Player styling */
    .plyr--video .plyr__controls {
      background: rgba(0, 0, 0, 0.6) !important;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .plyr__control {
      color: #0ff !important;
      transition: 0.3s;
    }

    .plyr__control:hover {
      color: #000 !important;
      background: #0ff !important;
      box-shadow: 0 0 15px #0ff;
    }

    footer {
      background: rgba(0,0,0,0.8);
      text-align: center;
      padding: 15px;
      border-top: 2px solid #0ff;
      box-shadow: 0 -2px 15px rgba(0,255,255,0.4);
      font-size: 14px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1 class="neon-text text-2xl">MPT Player</h1>
  </header>

  <!-- Video Player -->
  <main class="container mx-auto mt-10 px-4">
    <div class="glass-card max-w-4xl mx-auto">
      <video id="player" playsinline controls>
        <source src="https://cdn.plyr.io/static/blank.mp4" type="video/mp4" />
      </video>

      <!-- Download Now Button -->
      <div class="text-center mt-6">
        <a onclick="lazyDownload()" class="neon-btn">Download Now</a>
      </div>
    </div>
  </main>

  <!-- External Players -->
  <section class="mt-10">
    <h2 class="text-center text-xl mb-6 neon-text">Play with...</h2>
    <div class="grid grid-cols-2 gap-4 px-6 max-w-2xl mx-auto">
      <div onclick="vlc_player()" class="neon-btn rounded-xl px-4 py-3 cursor-pointer text-center">VLC Player</div>
      <div onclick="mx_player()" class="neon-btn rounded-xl px-4 py-3 cursor-pointer text-center">MX Player</div>
      <div onclick="playit_player()" class="neon-btn rounded-xl px-4 py-3 cursor-pointer text-center">Play-it</div>
      <div onclick="km_player()" class="neon-btn rounded-xl px-4 py-3 cursor-pointer text-center">KM Player</div>
      <div onclick="s_player()" class="neon-btn rounded-xl px-4 py-3 cursor-pointer text-center">S Player</div>
      <div onclick="hd_player()" class="neon-btn rounded-xl px-4 py-3 cursor-pointer text-center">HD Player (4K)</div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    © 2025 MPT Player | All Rights Reserved
  </footer>

  <script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: [
        'play-large', 'rewind', 'play', 'fast-forward',
        'progress', 'current-time', 'duration', 'mute',
        'volume', 'captions', 'settings', 'pip', 'airplay',
        'download', 'fullscreen'
      ]
    });

    </script>
	<script>
        const videolink = window.location.href;
        const  lazyLink = videolink.replace("/watch/", "/");

        function vlc_player() {
            const openLazyLink = lazyLink;
            const openVlc = `vlc://${openLazyLink}`;
            window.location.href = openVlc;
        }
	    
	function mx_player() {
            const openLazyLink = lazyLink;
            const openMx = `intent:${openLazyLink}#Intent;package=com.mxtech.videoplayer.ad;end`;
            window.location.href = openMx;
        }
        
	function playit_player() {
    	const openLazyLink = lazyLink;
    	const openPlayit = `playit://playerv2/video?url=${openLazyLink}`;
   	 window.location.href = openPlayit;
	}
	    
	function s_player() {
            const openLazyLink = lazyLink;
            const openSplayer = `intent:${openLazyLink}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end`;
            window.location.href = openSplayer;
        }
	    
	function km_player() {
           const openLazyLink = lazyLink;
           const openKmplayer = `intent:${openLazyLink}#Intent;package=com.kmplayer;end`;
           window.location.href = openKmplayer;
        }
        
	function hd_player() {
           const openLazyLink = lazyLink;
           const openHDplayer = `intent:${openLazyLink}#Intent;package=uplayer.video.player;end`;
           window.location.href = openHDplayer;
        }
	    
        function lazyDownload() {
            const openLazyLink = lazyLink;
            window.location.href = openLazyLink;
        }

    </script>

</body>
</html>
