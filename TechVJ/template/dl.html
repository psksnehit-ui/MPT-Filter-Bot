<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPT Player</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Background Gradient */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, #ff00ff, #00ffff, #ff0099, #00ffcc);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      z-index: -2;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(5px);
      z-index: -1;
    }

    .neon-text {
      font-family: 'Orbitron', sans-serif;
      color: #0ff;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
    }

    header {
      background: rgba(20, 20, 40, 0.8);
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #0ff;
      box-shadow: 0 2px 15px rgba(0,255,255,0.3);
    }

    .glass-card {
      background: rgba(20, 20, 40, 0.7);
      border: 2px solid rgba(0, 255, 255, 0.5);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      padding: 2rem;
    }

    .neon-btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      font-weight: bold;
      transition: all 0.3s;
      border-radius: 30px;
      padding: 10px 25px;
      margin: 8px;
      display: inline-block;
      text-decoration: none;
    }

    .neon-btn:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
    }

    /* Telegram dropdown with smooth animation */
    .telegram-dropdown {
      position: relative;
      display: inline-block;
    }

    .telegram-dropdown-content {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 40, 0.9);
      border: 2px solid #0ff;
      border-radius: 10px;
      padding: 15px;
      width: 260px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,255,255,0.4);
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translate(-50%, -20px);
    }

    .telegram-dropdown-content a {
      display: block;
      padding: 8px;
      border-radius: 8px;
      text-decoration: none;
      color: #0ff;
      border: 1px solid #0ff;
      font-size: 14px;
    }

    .telegram-dropdown-content a:hover {
      background: #0ff;
      color: #000;
    }

    .telegram-dropdown:hover .telegram-dropdown-content {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .plyr--video .plyr__controls {
      background: rgba(0, 0, 0, 0.6) !important;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .plyr__control {
      color: #0ff !important;
      transition: 0.3s;
    }

    .plyr__control:hover {
      color: #000 !important;
      background: #0ff !important;
      box-shadow: 0 0 15px #0ff;
    }

    footer {
      background: rgba(0,0,0,0.8);
      text-align: center;
      padding: 15px;
      border-top: 2px solid #0ff;
      box-shadow: 0 -2px 15px rgba(0,255,255,0.4);
      font-size: 14px;
    }
</style>

</head>

<body>
    	<!-- Navbar -->
	<nav class="navbar navbar-expand-lg bg-dark bg-opacity-50 border-b border-cyan-400">
	<div class="container">
	  <a class="navbar-brand neon-text" href="#">MPT Player</a>
	</div>
	</nav>
  
  <!-- Main Content -->
  <div class="container d-flex justify-content-center align-items-center py-5 flex-grow-1">
    <div class="glass-card text-center w-100" style="max-width: 900px;">
      <h2 class="neon-text mb-4" id="movie-title">Movie Name Here</h2>
      
      <!-- Video Player -->
      <video id="player" playsinline controls>
        <source src="https://cdn.plyr.io/static/blank.mp4" type="video/mp4" />
        <track kind="captions" label="English" src="captions.vtt" srclang="en" default />
      </video>

      <!-- Download & Share Buttons -->
      <div class="mt-4">
        <a href="https://example.com/download" class="neon-btn">⬇ Download Now</a>
        <a href="#" class="neon-btn">🔗 Share Link</a>
      </div>

      <!-- Telegram Dropdown -->
      <div class="mt-4 text-center telegram-dropdown">
        <a href="#" class="neon-btn">📢 Join Telegram</a>
        <div class="telegram-dropdown-content">
          <a href="https://t.me/MnTLinkss">Channel 1</a>
          <a href="https://t.me/MoviesPlusTelugu">Channel 2</a>
          <a href="https://t.me/channel3">Channel 3</a>
          <a href="https://t.me/channel4">Channel 4</a>
          <a href="https://t.me/channel5">Channel 5</a>
          <a href="https://t.me/channel6">Channel 6</a>
        </div>
      </div>
    </div>
  </div>
                  
<!-- footer of sidebar -->
<footer>
    <p>© 2025 CyberPlayer. All Rights Reserved. | Registered Trademark ⚡</p>
</footer>
                    
  

<!-- Plyr JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: [
        'play-large', 'rewind', 'play', 'fast-forward', 
        'progress', 'current-time', 'duration', 'mute', 
        'volume', 'captions', 'settings', 'pip', 'airplay', 
        'download', 'fullscreen'
      ]
    });

    // Set Movie Name dynamically
    document.getElementById('movie-title').innerText = "%s";
  </script>
</body>
</html>
